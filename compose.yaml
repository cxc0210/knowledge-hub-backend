name: knowledge-hub

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_hub_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/postgresql/data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
      - type: bind
        source: ./docker/postgres/init/01-enable-vector.sql
        target: /docker-entrypoint-initdb.d/01-enable-vector.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-knowledge_hub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-knowledge_hub_dev}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-knowledge_hub}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/mongodb/data
        target: /data/db
        bind:
          create_host_path: true
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/mongodb/configdb
        target: /data/configdb
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand(''ping'').ok ? 0 : 2)"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION:-9.5.6}
        IK_VERSION: ${ELASTIC_VERSION:-9.5.6}
    image: knowledge-hub-elasticsearch:${ELASTIC_VERSION:-9.5.6}-ik
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/elasticsearch/data
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: true
    mem_limit: ${ELASTICSEARCH_MEMORY_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.5.6}
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      SERVER_NAME: knowledge-hub-kibana
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "${KIBANA_PORT:-5601}:5601"

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/ollama
        target: /root/.ollama
        bind:
          create_host_path: true
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-2g}
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  ollama-model:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_PULL_INSECURE: ${OLLAMA_PULL_INSECURE:-false}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if [ "$${OLLAMA_PULL_INSECURE}" = "true" ]; then
          exec ollama pull --insecure "$${EMBEDDING_MODEL}"
        fi
        exec ollama pull "$${EMBEDDING_MODEL}"

  rustfs-permissions:
    image: alpine:3.22
    restart: "no"
    volumes:
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/rustfs/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/rustfs/logs
        target: /app/logs
        bind:
          create_host_path: true
    command:
      - sh
      - -ec
      - chown -R 10001:10001 /data /app/logs

  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-false}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/rustfs/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /Users/andrechen/Desktop/Andre/playground/knowledge-hub-playground/rustfs/logs
        target: /app/logs
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - sh
        - -ec
        - curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
